services:
  mysql:
    image: mysql:8.4
    container_name: estatecore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-estatecore_root_secure_pass_2026}
      MYSQL_DATABASE: ${DB_NAME:-estatecore_db}
      MYSQL_USER: ${DB_USERNAME:-estatecore_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-estatecore_secure_pass_2026}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - estatecore_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - estatecore_network

volumes:
  estatecore_mysql_data:
    name: estatecore_mysql_data

networks:
  estatecore_network:
    name: estatecore_network
    driver: bridge
